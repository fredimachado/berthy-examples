# Run the whole todo app on your machine: the API (built from ./api), Postgres and Redis.
#
#   docker compose -f todo/compose.dev.yml up --build
#   open http://localhost:8080
#   docker compose -f todo/compose.dev.yml down -v      # stop and delete the data
#
# DEV ONLY. The passwords below are throwaway values for a laptop. Nothing
# here is published except the API on localhost. Berthy deploys never use this
# file: they use todo/berthy/.
name: todo-dev

x-api: &api
  build:
    context: ./api
    args:
      VERSION: dev
  image: todo-api:dev
  environment:
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: todo
    DB_USER: todo
    POSTGRES_PASSWORD: dev-only-postgres-password
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: dev-only-redis-password
    LOG_LEVEL: debug

services:
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: dev-only-postgres-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "dev-only-redis-password", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=dev-only-redis-password redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # In production Berthy runs the migrations as their own deploy step. Here a
  # one-off service does it, and the API starts after it has finished.
  migrate:
    <<: *api
    command: ["/app/bin/migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
