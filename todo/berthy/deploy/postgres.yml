# The todo database. Berthy deploys this file as the Compose app "postgres".
# It reads POSTGRES_DB and POSTGRES_USER from env.plain and POSTGRES_PASSWORD
# from env.secret of the manifest. Berthy writes them to the project's .env file.
services:
  postgres:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The dump job writes here. The volume backup uploads it.
      - db-dumps:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No ports are published. The API reaches the database by its alias.
    networks:
      todo:
        aliases:
          - todo-db

volumes:
  pgdata:
  db-dumps:

# The shared network that berthy setup created. A Compose app must join it itself.
networks:
  todo:
    external: true
    name: todo
