name: todo-dotnet

on:
  push:
    paths:
      - 'todo-dotnet/**'
      - '.github/workflows/todo-dotnet.yml'
  pull_request:
    paths:
      - 'todo-dotnet/**'
      - '.github/workflows/todo-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: todo-dotnet-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test, AspireWeb, PublishedWeb
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '11.0.x'

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: todo-dotnet/web/package-lock.json

      - name: Install Aspire CLI
        run: |
          dotnet tool install -g Aspire.Cli --version 17.0.0
          echo "$HOME/.dotnet/tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          aspire --version

      - name: .NET tests
        run: |
          dotnet test todo-dotnet/Tests/Todo.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frontend install and build
        run: |
          npm --prefix todo-dotnet/web ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix todo-dotnet/web run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Playwright Chromium
        run: |
          Push-Location todo-dotnet/web
          try {
            npx --no-install playwright install --with-deps chromium
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: AspireWeb
        run: |
          pwsh -NoProfile -File todo-dotnet/scripts/verify.ps1 -Target AspireWeb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish API with SPA
        run: |
          $todoPublishDir = Join-Path ([System.IO.Path]::GetTempPath()) ([guid]::NewGuid().ToString())
          Write-Host "PublishDir=$todoPublishDir"
          echo "TODO_PUBLISH_DIR=$todoPublishDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          dotnet publish todo-dotnet/Api/Todo.Api.csproj --configuration Release --output $todoPublishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PublishedWeb
        run: |
          pwsh -NoProfile -File todo-dotnet/scripts/verify.ps1 -Target PublishedWeb -PublishDir $env:TODO_PUBLISH_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Both architectures the release publishes, built and not pushed.
      - name: Build the image for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: todo-dotnet
          file: todo-dotnet/Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build the image and load it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: todo-dotnet
          file: todo-dotnet/Api/Dockerfile
          load: true
          tags: todo-dotnet-api:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}

      - name: Smoke test the image
        run: |
          docker run --rm todo-dotnet-api:ci version | grep -q "^ci ${GITHUB_SHA}$"
          set +e
          out=$(docker run --rm todo-dotnet-api:ci migrate 2>&1)
          status=$?
          set -e
          echo "$out"
          [ "$status" -eq 1 ]
          echo "$out" | grep -q "Missing required configuration setting 'ConnectionStrings:tododb'"
          test "$(docker image inspect todo-dotnet-api:ci --format '{{.Config.User}}')" = "1654"
